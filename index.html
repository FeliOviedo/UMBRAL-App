<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E13" />
    <meta
      name="description"
      content="Umbral — entrenamiento de running adaptable, guiado por percepción de esfuerzo."
    />
    <title>Umbral</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      El tema se resuelve ANTES de que pinte React. Si esperáramos al primer
      render, quien elige claro vería un flash oscuro en cada carga, que es
      justo lo que arruina la sensación de app nativa.
      La lógica está duplicada a propósito con src/store/theme.store.ts: acá no
      hay módulos todavía, y meter un import bloquearía el pintado.
    -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('umbral:tema');
          var tema =
            guardado === 'dark' || guardado === 'light'
              ? guardado
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = tema;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
