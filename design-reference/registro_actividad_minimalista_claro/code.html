<body class="bg-background text-on-background antialiased min-h-screen flex flex-col selection:bg-ui-accent selection:text-tertiary">
<!-- Content Canvas -->
<main class="flex-grow flex flex-col px-margin-edge py-section-gap max-w-4xl mx-auto w-full">
<!-- Header -->
<header class="mb-section-gap flex flex-col items-center text-center">
<span class="material-symbols-outlined text-4xl text-ui-accent mb-component-gap" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">
                ¡ENTRENAMIENTO<br/>COMPLETADO!
            </h1>
</header>
<!-- Hero Metrics -->
<section class="flex flex-col md:flex-row justify-center items-center gap-gutter md:gap-section-gap mb-section-gap">
<div class="flex flex-col items-center">
<span class="font-display-hero text-display-hero-mobile md:text-display-hero text-primary">12.4</span>
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-widest mt-unit">KILÓMETROS</span>
</div>
<div class="hidden md:block w-px h-16 bg-outline-variant"></div>
<div class="flex flex-col items-center">
<span class="font-display-hero text-display-hero-mobile md:text-display-hero text-primary">1:02:45</span>
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-widest mt-unit">TIEMPO TOTAL</span>
</div>
</section>
<!-- Comparison Bars -->
<section class="mb-section-gap flex flex-col gap-margin-edge w-full max-w-2xl mx-auto">
<!-- Distance -->
<div>
<div class="flex justify-between items-end mb-unit">
<span class="font-label-caps text-label-caps text-secondary uppercase">DISTANCIA</span>
<div class="text-right">
<span class="font-data-tabular-sm text-data-tabular-sm text-primary">12.4</span>
<span class="font-label-caps text-label-caps text-secondary"> / 12.0 km</span>
</div>
</div>
<div class="w-full h-2 bg-surface-container rounded-full overflow-hidden flex relative">
<div class="h-full bg-outline-variant absolute left-0 z-0" style="width: 100%;"></div>
<div class="h-full bg-ui-accent absolute left-0 z-10" style="width: 103%;"></div>
</div>
</div>
<!-- Pace -->
<div>
<div class="flex justify-between items-end mb-unit">
<span class="font-label-caps text-label-caps text-secondary uppercase">RITMO MEDIO</span>
<div class="text-right">
<span class="font-data-tabular-sm text-data-tabular-sm text-primary">5:03</span>
<span class="font-label-caps text-label-caps text-secondary"> / 5:10 min/km</span>
</div>
</div>
<div class="w-full h-2 bg-surface-container rounded-full overflow-hidden flex relative">
<div class="h-full bg-outline-variant absolute left-0 z-0" style="width: 100%;"></div>
<div class="h-full bg-zone-3 absolute left-0 z-10" style="width: 95%;"></div>
</div>
</div>
</section>
<!-- Qualitative Input -->
<section class="mb-section-gap w-full max-w-2xl mx-auto flex flex-col gap-margin-edge">
<!-- RPE Slider -->
<div class="flex flex-col gap-component-gap">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="rpe-slider">ESFUERZO PERCIBIDO (RPE)</label>
<div class="flex items-center gap-gutter">
<span class="font-data-tabular-sm text-data-tabular-sm text-primary w-4 text-center">1</span>
<input class="w-full h-1 bg-surface-container appearance-none outline-none accent-primary" id="rpe-slider" max="10" min="1" type="range" value="7"/>
<span class="font-data-tabular-sm text-data-tabular-sm text-primary w-6 text-center" id="rpe-value">7</span>
</div>
</div>
<!-- Feeling Emojis -->
<div class="flex flex-col gap-component-gap">
<span class="font-label-caps text-label-caps text-secondary uppercase">¿CÓMO TE SENTISTE?</span>
<div class="flex justify-between gap-unit">
<button class="w-12 h-12 flex items-center justify-center rounded-none bg-surface hover:bg-surface-variant transition-colors border border-transparent focus:border-primary">
<span class="text-2xl">😫</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-none bg-surface hover:bg-surface-variant transition-colors border border-transparent focus:border-primary">
<span class="text-2xl">☹️</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-none bg-surface hover:bg-surface-variant transition-colors border border-transparent focus:border-primary">
<span class="text-2xl">😐</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-none bg-surface-variant transition-colors border border-primary">
<span class="text-2xl">🙂</span>
</button>
<button class="w-12 h-12 flex items-center justify-center rounded-none bg-surface hover:bg-surface-variant transition-colors border border-transparent focus:border-primary">
<span class="text-2xl">🤩</span>
</button>
</div>
</div>
</section>
<!-- Actions -->
<div class="mt-auto w-full max-w-2xl mx-auto flex flex-col gap-component-gap pb-section-gap">
<button class="w-full bg-ui-accent text-tertiary font-headline-lg text-headline-lg-mobile md:text-headline-lg tracking-tighter uppercase py-gutter hover:opacity-90 transition-opacity flex items-center justify-center gap-unit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                GUARDAR Y ANALIZAR
            </button>
<button class="w-full bg-transparent text-primary border-b border-primary hover:border-ui-accent hover:text-ui-accent transition-colors py-component-gap font-label-caps text-label-caps uppercase tracking-widest text-center">
                DESCARTAR
            </button>
</div>
</main>
<script>
        const slider = document.getElementById('rpe-slider');
        const output = document.getElementById('rpe-value');
        slider.oninput = function() {
            output.innerHTML = this.value;
        }
    </script>
</body></html>
