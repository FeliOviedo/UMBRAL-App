        .card-surface { background-color: #151A22; border: 1px solid #232B36; border-radius: 16px; }

<body class="bg-[#0B0E13] text-on-background font-body-sm pb-24 md:pb-0">

<header class="fixed top-0 w-full z-50 border-b border-surface-variant dark:border-surface-variant bg-background dark:bg-background">
<div class="flex justify-between items-center px-container-margin h-16 w-full max-w-7xl mx-auto">
<button class="text-primary dark:text-primary hover:bg-surface-container dark:hover:bg-surface-container transition-colors duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary tracking-tighter">UMBRAL</h1>
<div class="w-8 h-8 rounded-full overflow-hidden border border-surface-variant cursor-pointer">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="A detailed headshot portrait of an athletic user, slightly sweaty post-workout, wearing modern high-performance running gear. The lighting is dramatic and moody, reflecting an intense, focused aesthetic suitable for an elite sports app avatar. Dark background with subtle rim lighting on the face." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAL5bW9uO8VuSLC8FEo4a-eOVA_1-tvx7ycnDMKZgXWoHZqqDMQevsTUEvq4WQpD82Vst_1zpr2wdDlTxLJWvUZq46JIbTaStgHBb0ZL8k8tA8FNKhexfIOAJK_IiujrRZScfmgPV6zeTHOj3FmH2JZ0_CaVUVSZa_YH1yWP3CrhNK3A3jFQo1803spF66MIrAd6cUkXPpxainrnEtGj292GfpZedIUK9L7w8mslvvI090hR-QineeJyg"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-container-margin max-w-7xl mx-auto flex flex-col gap-16 md:flex-row md:items-start md:gap-16">
<!-- Left Column: Core Focus -->
<div class="flex-1 flex flex-col gap-12">
<!-- Today's Plan Anchor -->
<section class="flex flex-col items-center justify-center text-center">
<div class="flex items-center justify-center mb-unit gap-1">
<span class="font-label-caps text-label-caps text-[#9AA7B4]">OBJETIVO DE HOY</span>
<span class="material-symbols-outlined text-[#CDFF4F] text-sm">bolt</span>
</div>
<h2 class="font-headline-md text-headline-md text-primary-core mb-unit uppercase tracking-tight">10km Tempo (Z3)</h2>
<p class="font-body-sm text-body-sm text-outline">Mantener ritmo umbral lactato. 45 min est.</p>
</section>
<!-- Weekly Progress Ring -->
<section class="flex flex-col items-center justify-center">
<div class="relative w-64 h-64 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="#232B36" stroke-width="4"></circle>
<circle class="ring-progress" cx="50" cy="50" fill="none" r="45" stroke="#CDFF4F" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="font-display-metrics text-display-metrics text-primary leading-none">42</span>
<span class="font-label-caps text-label-caps text-outline tracking-widest mt-2">KM / 60KM</span>
</div>
</div>
<div class="mt-4 flex gap-4 text-center">
<div>
<span class="block font-data-tabular text-data-tabular text-primary">70%</span>
<span class="block font-label-caps text-label-caps text-outline">COMPLETO</span>
</div>
</div>
</section>
</div>
<!-- Right Column: Context & Widgets -->
<div class="flex-1 flex flex-col gap-12 w-full md:max-w-md">
<!-- Recovery Status -->
<div class="flex items-center gap-4 justify-center md:justify-start">
<div class="w-8 h-8 rounded-full bg-[#CDFF4F] flex items-center justify-center">
<span class="material-symbols-outlined text-background text-sm" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div>
<h3 class="font-data-tabular text-data-tabular text-primary">Supercompensación</h3>
</div>
</div>
<!-- Next Challenge -->
<div class="flex flex-col items-center md:items-start group cursor-pointer transition-colors text-center md:text-left">

<div class="flex items-center gap-2">
<h3 class="font-data-tabular text-data-tabular text-primary group-hover:text-primary-core transition-colors">Largo 18km</h3>
<span class="material-symbols-outlined text-outline group-hover:text-primary-core transition-colors">arrow_forward</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Domingo, 07:00 AM</p>

<div class="h-24 w-full flex items-end justify-between gap-2">
<div class="w-full bg-[#CDFF4F] opacity-40 rounded-t-sm" style="height: 30%"></div>
<div class="w-full bg-[#CDFF4F] opacity-60 rounded-t-sm" style="height: 50%"></div>
<div class="w-full bg-[#CDFF4F] opacity-40 rounded-t-sm" style="height: 20%"></div>
<div class="w-full bg-[#CDFF4F] rounded-t-sm shadow-[0_0_8px_rgba(205,255,79,0.5)]" style="height: 80%"></div>
<div class="w-full bg-surface-variant rounded-t-sm" style="height: 10%"></div>
<div class="w-full bg-surface-variant rounded-t-sm" style="height: 15%"></div>
<div class="w-full bg-surface-variant rounded-t-sm" style="height: 5%"></div>
</div>

<span>L</span><span>M</span><span>X</span><span class="text-primary-core">J</span><span>V</span><span>S</span><span>D</span>
</div>
</div>
</div>

<span class="material-symbols-outlined">event_note</span>
